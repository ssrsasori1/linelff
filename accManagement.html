<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet Pro - Live API Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Kanit', sans-serif; background: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .soft-grad { background: linear-gradient(135deg, #818cf8 0%, #a78bfa 100%); }
        #main-header { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 40; position: relative; }
        .header-shrunk { padding: 1rem 1.5rem !important; border-radius: 0 0 1.5rem 1.5rem !important; }
        .summary-container { transition: all 0.4s ease; }
        .header-shrunk .summary-container { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 0.5rem; }
        .header-shrunk #balance-label { display: none; }
        .header-shrunk #total-balance { font-size: 1.4rem !important; margin: 0 !important; }
        #mini-stats { display: none; gap: 0.75rem; font-size: 0.75rem; font-weight: 700; }
        .header-shrunk #mini-stats { display: flex; }
        .header-shrunk #summary-grid { display: none; }
        #summary-grid { transition: opacity 0.3s ease, max-height 0.3s ease; opacity: 1; max-height: 200px; }
        .sticky-title { position: sticky; top: 0; z-index: 30; background: white; padding: 1rem 0; margin-bottom: 0.5rem; }
        
        /* Loading Overlay */
        #loader { transition: opacity 0.3s ease; }
        .hide-loader { opacity: 0; pointer-events: none; }

        ::-webkit-scrollbar { width: 0px; }
        .modal-active { display: flex !important; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s ease-out; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen relative">

    <div id="loader" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[200] flex flex-col items-center justify-center hide-loader">
        <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-500 mb-4"></i>
        <p class="text-slate-600 font-bold">กำลังซิงค์ข้อมูลกับ Database...</p>
    </div>

    <div class="w-full max-w-md h-[95vh] bg-white shadow-2xl flex flex-col relative overflow-hidden sm:rounded-[3rem] border border-slate-100">
        
        <div id="main-header" class="p-8 soft-grad text-white rounded-b-[3rem] shadow-lg shrink-0">
            <div class="flex justify-between items-center mb-6 header-top">
                <input type="month" id="current-cycle" onchange="render()" class="bg-white/20 border-none text-sm font-bold rounded-full px-4 py-1 focus:ring-0 cursor-pointer text-white">
                <button onclick="openSettings()" class="bg-white/20 w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/30 transition">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
            
            <div class="summary-container">
                <div class="flex flex-col">
                    <span id="balance-label" class="text-white/80 text-[10px] uppercase tracking-widest block mb-1">ยอดคงเหลือ</span>
                    <h2 id="total-balance" class="text-5xl font-bold tracking-tight">฿0</h2>
                </div>
                <div id="mini-stats">
                    <div class="flex items-center gap-1 text-emerald-100"><i class="fas fa-arrow-down scale-75"></i><span id="mini-income">฿0</span></div>
                    <div class="flex items-center gap-1 text-rose-100"><i class="fas fa-arrow-up scale-75"></i><span id="mini-expense">฿0</span></div>
                </div>
            </div>

            <div id="summary-grid" class="grid grid-cols-2 gap-4 mt-6">
                <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 text-center shadow-sm">
                    <p class="text-[9px] uppercase opacity-80 mb-1">รายรับ</p>
                    <p id="total-income" class="font-bold text-emerald-100 text-lg leading-none">฿0</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 text-center shadow-sm">
                    <p class="text-[9px] uppercase opacity-80 mb-1">รายจ่าย</p>
                    <p id="total-expense" class="font-bold text-rose-100 text-lg leading-none">฿0</p>
                </div>
            </div>
        </div>

        <div id="scroll-container" class="flex-1 overflow-y-auto px-6 pt-2 pb-32">
            <div id="fix-cost-alert" class="my-4 p-4 bg-amber-50 rounded-2xl hidden animate-pop shadow-sm border border-amber-100 items-center justify-between text-amber-800">
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase font-bold text-amber-500">พบ Fix Cost ใหม่</span>
                    <span class="text-xs font-bold">บันทึกรายการประจำเดือน?</span>
                </div>
                <button onclick="applyFixCosts()" class="bg-amber-400 text-white hover:bg-amber-500 transition px-4 py-1.5 rounded-full text-[10px] font-black shadow-sm">บันทึกด่วน</button>
            </div>

            <div class="sticky-title">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2 text-lg"><i class="fas fa-wallet text-indigo-400 text-sm"></i> รายการทั้งหมด</h3>
                    <span id="transaction-count" class="text-[9px] bg-slate-100 px-2 py-1 rounded-full text-slate-500 font-bold uppercase tracking-widest">0 รายการ</span>
                </div>
            </div>

            <div id="list-items" class="space-y-4"></div>
        </div>

        <div class="absolute bottom-6 left-0 right-0 px-8 z-50">
            <button onclick="openModal()" class="w-full soft-grad text-white py-4 rounded-3xl font-bold shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 transform active:scale-95 transition hover:opacity-90">
                <i class="fas fa-plus-circle text-2xl"></i> เพิ่มรายการใหม่
            </button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-slate-900/40 hidden items-end sm:items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 animate-pop shadow-xl">
            <h2 id="modal-title" class="text-2xl font-black mb-6 text-slate-700">บันทึกรายการ</h2>
            <input type="hidden" id="edit-id">
            
            <div class="space-y-4">
                <select id="in-type" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none font-bold text-slate-600 appearance-none focus:ring-2 focus:ring-indigo-200">
                    <option value="income">รายรับ (+)</option>
                    <option value="expense">รายจ่าย (-)</option>
                    <option value="fix-cost">Fix Cost (รายจ่ายประจำ)</option>
                </select>
                
                <div>
                    <input type="text" id="in-title" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none font-medium mb-2 focus:ring-2 focus:ring-indigo-200" placeholder="ชื่อรายการ">
                    <div id="suggestions" class="flex flex-wrap gap-2 mt-1"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="in-amount" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none font-bold focus:ring-2 focus:ring-indigo-200" placeholder="0.00">
                    <input type="date" id="in-date" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none text-sm font-bold focus:ring-2 focus:ring-indigo-200">
                </div>

                <div id="recurring-field">
                    <label class="text-[10px] font-bold text-indigo-400 ml-1 uppercase tracking-widest">บันทึกล่วงหน้า (เดือน)</label>
                    <select id="in-months" class="w-full p-3 bg-indigo-50/50 rounded-xl border border-indigo-50 outline-none mt-1 text-sm font-bold text-indigo-500 focus:ring-2 focus:ring-indigo-200">
                        <option value="1">1 เดือน (ปกติ)</option>
                        <option value="3">3 เดือน</option>
                        <option value="6">6 เดือน</option>
                        <option value="12">12 เดือน</option>
                    </select>
                </div>
                
                <div class="flex gap-4 pt-4">
                    <button onclick="closeModal()" class="flex-1 py-4 text-slate-400 hover:bg-slate-50 rounded-2xl font-bold transition">ยกเลิก</button>
                    <button onclick="saveItem()" class="flex-1 py-4 soft-grad text-white rounded-2xl font-bold shadow-md shadow-indigo-200 hover:opacity-90 transition">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 hidden items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 max-h-[85vh] flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-6 text-slate-700">
                <h2 class="text-2xl font-black">ตั้งค่า Fix Cost</h2>
                <button onclick="closeSettings()"><i class="fas fa-times text-xl text-slate-300 hover:text-slate-500 transition"></i></button>
            </div>
            <div class="bg-indigo-50/50 border border-indigo-50 p-5 rounded-3xl mb-6">
                <div class="space-y-2">
                    <input type="text" id="set-title" placeholder="ชื่อรายการ" class="w-full p-3 rounded-xl border border-slate-100 text-sm font-medium focus:ring-2 focus:ring-indigo-200 outline-none">
                    <input type="number" id="set-amount" placeholder="จำนวนเงิน" class="w-full p-3 rounded-xl border border-slate-100 text-sm font-bold focus:ring-2 focus:ring-indigo-200 outline-none">
                    <button onclick="addFixTemplate()" class="w-full bg-indigo-400 hover:bg-indigo-500 text-white py-3 rounded-xl text-sm font-bold shadow-sm transition">เพิ่มต้นแบบ</button>
                </div>
            </div>
            <div id="settings-list" class="flex-1 overflow-y-auto space-y-3"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔴 ตั้งค่า API ตรงนี้! (เปลี่ยนเป็นลิงก์ n8n ของคุณ)
        // ==========================================
        const API_BASE_URL = 'https://n8n.nex2gether.site/webhook/api/v1'; 
        const urlParams = new URLSearchParams(window.location.search);
        const CURRENT_UID = urlParams.get('uid') || '6d000a47-29ad-11f1-99a0-0ed3e82fa1a0'; // ถ้าไม่มีให้ใช้ usr-5555 เป็นค่าเริ่มต้น


        // State ควบคุมข้อมูล
        let currentItems = [];
        let fixTemplates = [];

        const monthInput = document.getElementById('current-cycle');
        const scrollContainer = document.getElementById('scroll-container');
        const mainHeader = document.getElementById('main-header');
        const loader = document.getElementById('loader');
        
        // ตั้งค่าย้อนหลังให้เป็นเดือนปัจจุบัน
        const today = new Date();
        monthInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

        // ==========================================
        // 🛠️ API Helper Function (ตัวกลางสำหรับยิง API)
        // ==========================================
        async function apiCall(endpoint, method = 'GET', body = null) {
            showLoader();
            try {
                const options = {
                    method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-User-ID': CURRENT_UID // ส่ง UID ลับไปกับ Header ป้องกันคนแฮก!
                    }
                };
                if (body) options.body = JSON.stringify(body);
                
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                // ดักจับกรณีที่ n8n ไม่ได้ส่งอะไรกลับมา (เช่น ตอน DELETE)
                const text = await response.text();
                return text ? JSON.parse(text) : { status: 'success' };

            } catch (error) {
                console.error('API Connect Error:', error);
                alert('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาตรวจสอบลิงก์ Webhook n8n');
                return null;
            } finally {
                hideLoader();
            }
        }

        function showLoader() { loader.classList.remove('hide-loader'); }
        function hideLoader() { loader.classList.add('hide-loader'); }

        // ==========================================
        // 🔄 ฟังก์ชันหลัก: โหลดข้อมูลจาก Database
        // ==========================================
        // ==========================================
        // 🔄 ฟังก์ชันหลัก: โหลดข้อมูลจาก Database
        // ==========================================
       async function render() {
            const cycle = monthInput.value;
            
            // 📡 ยิง API ดึงทั้ง 2 ตาราง
            const txData = await apiCall(`/transactions?cycle=${cycle}`);
            const fixData = await apiCall(`/fix-costs`); 

            // จัดการข้อมูล Transactions
            if (Array.isArray(txData)) currentItems = txData; 
            else if (txData && Array.isArray(txData.data)) currentItems = txData.data; 
            else if (txData && txData.id) currentItems = [txData]; 
            else currentItems = []; 
            
            // 🌟 จัดการข้อมูล Fix Cost Templates
            if (Array.isArray(fixData)) fixTemplates = fixData; 
            else if (fixData && Array.isArray(fixData.data)) fixTemplates = fixData.data; 
            else if (fixData && fixData.id) fixTemplates = [fixData]; 
            else fixTemplates = []; 

            updateUI(currentItems);
            // 🌟 ให้วาดหน้าจอ Settings ใหม่ด้วยข้อมูลจาก DB
            renderSettingsList(); 
        }

        // ==========================================
        // 🎨 ฟังก์ชันวาด UI (เหมือนเดิมเป๊ะ แต่เปลี่ยน item.date เป็น item.tx_date ให้ตรงกับ DB)
        // ==========================================
        function updateUI(items) {
            const listItems = document.getElementById('list-items');
            listItems.innerHTML = '';
            let inc = 0, exp = 0;

            // Sort วันที่จากใหม่ไปเก่า
            items.sort((a,b) => new Date(b.tx_date) - new Date(a.tx_date));

            items.forEach(item => {
                const isIncome = item.type === 'income';
                const amount = Number(item.amount);
                if(isIncome) inc += amount; else exp += amount;

                // การแยกวันที่จาก DB (บางที MySQL จะส่งมาเป็น 2024-03-01T00:00:00.000Z)
                const txDate = new Date(item.tx_date).toLocaleDateString('th-TH', {day:'2-digit', month:'short'});

                const card = document.createElement('div');
                card.className = "flex justify-between items-center p-5 bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-all group animate-pop";
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${isIncome ? 'bg-emerald-100 text-emerald-500' : 'bg-rose-100 text-rose-500'}">
                            <i class="fas ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'} text-sm"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-700 text-sm leading-tight">${item.title}</p>
                            <p class="text-[10px] text-slate-400 font-medium uppercase mt-1">
                                ${txDate} ${item.type === 'fix-cost' ? '• <span class="text-amber-500 font-bold">Fix Cost</span>' : ''}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold ${isIncome ? 'text-emerald-500' : 'text-slate-600'} text-lg">฿${amount.toLocaleString()}</p>
                        <div class="flex gap-3 justify-end opacity-0 group-hover:opacity-100 transition-opacity mt-1">
                            <button onclick="editItem('${item.id}')" class="text-[10px] text-indigo-400 font-bold hover:underline">แก้</button>
                            <button onclick="deleteItem('${item.id}')" class="text-[10px] text-rose-400 font-bold hover:underline">ลบ</button>
                        </div>
                    </div>
                `;
                listItems.appendChild(card);
            });

            // อัปเดตตัวเลข
            const formattedInc = `฿${inc.toLocaleString()}`;
            const formattedExp = `฿${exp.toLocaleString()}`;
            document.getElementById('total-income').innerText = formattedInc;
            document.getElementById('mini-income').innerText = formattedInc;
            document.getElementById('total-expense').innerText = formattedExp;
            document.getElementById('mini-expense').innerText = formattedExp;
            document.getElementById('total-balance').innerText = `฿${(inc - exp).toLocaleString()}`;
            document.getElementById('transaction-count').innerText = `${items.length} รายการ`;
            
            // Alert Fix Cost
            const hasFixThisMonth = items.some(i => i.type === 'fix-cost');
            const alertBox = document.getElementById('fix-cost-alert');
            alertBox.classList.toggle('hidden', hasFixThisMonth || fixTemplates.length === 0 || items.length === 0);
            if (!hasFixThisMonth && fixTemplates.length > 0 && items.length > 0) alertBox.classList.add('flex');
            
            updateSuggestions();
        }

        function updateSuggestions() {
            const container = document.getElementById('suggestions');
            container.innerHTML = '';
            // ใช้ประวัติเฉพาะของเดือนนี้ที่ดึงมา (ถ้าอยากได้ทั้งหมดอาจจะต้องเก็บ State แยกไว้)
            const uniqueTitles = [...new Set(currentItems.map(i => i.title))].slice(0, 5);
            uniqueTitles.forEach(title => {
                const chip = document.createElement('span');
                chip.className = 'suggestion-chip';
                chip.innerText = title;
                chip.onclick = () => document.getElementById('in-title').value = title;
                container.appendChild(chip);
            });
        }

        // ==========================================
        // 💾 บันทึก/แก้ไขข้อมูล (POST / PUT)
        // ==========================================
        async function saveItem() {
            const title = document.getElementById('in-title').value;
            const amount = document.getElementById('in-amount').value;
            const type = document.getElementById('in-type').value;
            const startDate = new Date(document.getElementById('in-date').value);
            const repeatMonths = parseInt(document.getElementById('in-months').value);
            const editId = document.getElementById('edit-id').value;

            if(!title || !amount) return;

            if (editId) {
                // 📡 PUT: อัปเดตรายการเดิม (อย่าลืมสร้างโหนด PUT ใน n8n ถ้ายากให้ใช้ DELETE แล้ว POST ใหม่แทนได้ครับ)
                const payload = { 
                    id: editId,  // เพิ่มบรรทัดนี้ส่ง ID ไปด้วย
                    title, 
                    amount: parseFloat(amount), 
                    type, 
                    tx_date: document.getElementById('in-date').value, 
                    cycle: monthInput.value 
                };
                
                // ยิงไปที่ /transactions ตรงๆ เลย
                await apiCall(`/transactions`, 'PUT', payload);
            } else {
                // 📡 POST: สร้างรายการใหม่ (รวมแบบล่วงหน้า)
                let newTransactions = [];
                for (let i = 0; i < repeatMonths; i++) {
                    const targetDate = new Date(startDate);
                    targetDate.setMonth(startDate.getMonth() + i);
                    const cycle = `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}`;
                    
                    newTransactions.push({
                        title: repeatMonths > 1 ? `${title} (${i+1}/${repeatMonths})` : title,
                        amount: parseFloat(amount),
                        type,
                        tx_date: targetDate.toISOString().split('T')[0], // สำคัญ! Database ใช้ tx_date
                        cycle: cycle
                    });
                }
                
                await apiCall(`/transactions/bulk`, 'POST', { transactions: newTransactions });
            }
            closeModal(); 
            render(); // รีโหลดข้อมูลจาก DB ใหม่
        }

        // ==========================================
        // 🗑️ ลบข้อมูล (DELETE)
        // ==========================================
        async function deleteItem(id) {
            if(confirm('ลบรายการนี้ใช่หรือไม่?')) {
                // 🌟 แก้ไข: เปลี่ยนมาส่ง ID ผ่านเครื่องหมาย ? (Query Parameter) แทน
                await apiCall(`/transactions?id=${id}`, 'DELETE');
                render(); 
            }
        }

        // ==========================================
        // ⚙️ ส่วน Fix Cost (เหมือนเดิม แค่ครอบด้วย API)
        // ==========================================
        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            renderSettingsList();
        }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

        async function addFixTemplate() {
            const title = document.getElementById('set-title').value;
            const amount = document.getElementById('set-amount').value;
            if(!title || !amount) return;
            
            // 📡 POST: ส่งข้อมูลไปบันทึกลง Database
            await apiCall(`/fix-costs`, 'POST', { title, amount: parseFloat(amount) });
            
            document.getElementById('set-title').value = '';
            document.getElementById('set-amount').value = '';
            
            // 🌟 โหลดข้อมูลทั้งหมดใหม่ เพื่อให้ได้ UUID ของจริงจาก Database มาใช้งานF
            render(); 
        }

        function renderSettingsList() {
            const container = document.getElementById('settings-list');
            container.innerHTML = '';
            fixTemplates.forEach(t => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-100 shadow-sm";
                div.innerHTML = `
                    <div><p class="font-bold text-sm text-slate-700">${t.title}</p><p class="text-xs text-indigo-400 font-bold">฿${Number(t.amount).toLocaleString()}</p></div>
                    <button onclick="removeFixTemplate('${t.id}')" class="text-rose-300 hover:text-rose-400 transition p-2"><i class="fas fa-trash-alt"></i></button>
                `;
                container.appendChild(div);
            });
        }

        async function applyFixCosts() {
            const cycle = monthInput.value;
            const logs = fixTemplates.map(t => ({ 
                title: t.title, 
                amount: t.amount, 
                tx_date: `${cycle}-01`, // บันทึกวันที่ 1
                cycle: cycle,
                type: 'fix-cost' 
            }));
            
            await apiCall(`/transactions/bulk`, 'POST', { transactions: logs });
            render();
        }
        async function removeFixTemplate(id) {
            if(confirm('ยืนยันการลบต้นแบบรายการนี้?')) {
                // 📡 DELETE: ส่ง ID ไปลบใน Database
                await apiCall(`/fix-costs/${id}`, 'DELETE');
                render();
            }
        }

        // ==========================================
        // UI & Scroll Management
        // ==========================================
        let isShrunk = false;
        scrollContainer.addEventListener('scroll', () => {
            const currentScroll = scrollContainer.scrollTop;
            if (currentScroll > 60 && !isShrunk) {
                mainHeader.classList.add('header-shrunk');
                isShrunk = true;
            } else if (currentScroll < 15 && isShrunk) {
                mainHeader.classList.remove('header-shrunk');
                isShrunk = false;
            }
        });

        function openModal(editId = null) {
            const recurringField = document.getElementById('recurring-field');
            const modal = document.getElementById('modal');
            if(editId) {
                const item = currentItems.find(i => i.id === editId);
                document.getElementById('edit-id').value = item.id;
                document.getElementById('in-title').value = item.title;
                document.getElementById('in-amount').value = item.amount;
                document.getElementById('in-type').value = item.type;
                
                // แปลง Format วันที่กลับมาใส่ใน Input Date
                const dateObj = new Date(item.tx_date);
                document.getElementById('in-date').value = dateObj.toISOString().split('T')[0];
                recurringField.style.display = 'none';
            } else {
                document.getElementById('edit-id').value = "";
                document.getElementById('in-title').value = "";
                document.getElementById('in-amount').value = "";
                document.getElementById('in-date').valueAsDate = new Date();
                document.getElementById('in-months').value = "1";
                recurringField.style.display = 'block';
            }
            modal.classList.add('modal-active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('modal-active'); }
        function editItem(id) { openModal(id); }

        // Start Boot Application
        render();
    </script>
</body>
</html>
